name: 每日19點自動抓取台股盤後報告

on:
  schedule:
    # 台灣時間每日 19:00 (UTC 11:00) 與 19:30 (UTC 11:30) 自動執行
    - cron: '0 11 * * 1-5'
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write

jobs:
  scrape-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape latest report
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from modules.daily_report import scrape_report
          res = scrape_report()
          print('Status:', res.get('status'), 'Date:', res.get('date'), 'Stocks:', len(res.get('stocks_found', [])))
          "

      - name: Commit and push updated report cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/report_*.json
          git diff --staged --quiet || git commit -m "自動更新台股盤後報告 $(date +'%Y-%m-%d')"
          git push
