name: 每日盤後定時自動抓取最新分析報告

on:
  schedule:
    # 台灣時間平日 19:00 至 23:30 每 30 分鐘自動檢查一次 (UTC 11:00 ~ 15:30)
    # 確保無論上游作者在 19:00, 20:00, 21:00 還是 22:30 上傳，均能在 30 分鐘內自動同步！
    - cron: '0,30 11-15 * * 1-5'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write

jobs:
  scrape-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Scrape latest report
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from modules.daily_report import scrape_report
          res = scrape_report()
          print('Status:', res.get('status'), 'Date:', res.get('date'), 'Stocks:', len(res.get('stocks_found', [])))
          "

      - name: Commit and push updated report cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/report_*.json
          git diff --staged --quiet || git commit -m "自動更新台股盤後報告 $(date +'%Y-%m-%d')"
          git push
